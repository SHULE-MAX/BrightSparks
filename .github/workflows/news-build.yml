# ════════════════════════════════════════════════════════════════════════════
#  KEEP THE NEWS PAGES IN STEP WITH THE DASHBOARD
#
#  Staff publish a story in the Website Manager, which saves it to the school's
#  database. This workflow turns that story into a real page — news/<slug>/ —
#  along with a fresh sitemap, news sitemap and RSS feed, commits them, and
#  uploads them to the school's cPanel server. Within the half hour the story
#  is live, and nobody has touched the code or a File Manager.
#
#  THE UPLOAD IS THE STEP THAT MATTERS
#  brightsparksjunior.ac.ug is not served from this repository — it is a cPanel
#  account, and a page committed here reaches nobody until it is put there.
#  Before this step was automated that was a manual zip upload, so a story
#  published in the dashboard stayed invisible until somebody remembered to do
#  it. That is exactly how "NAMING OF UGANDA'S CRUDE OIL" came to have a page
#  in the repository, a card on the news page, and a 404 behind the link.
#
#  WHY THIS UPLOADS OVER HTTPS AND NOT FTP
#  It used to be an FTPS step, and that step never once succeeded. FTP sends
#  file contents over a second connection to a high port the server picks, and
#  this host does not allow those from outside: the log shows the server answer
#  "229 Extended Passive mode OK (|||55656|)" and then nothing ever answering on
#  55656. Only the host can open that range, GitHub's runners have no fixed
#  address to allowlist, and raising the timeout only made the same failure take
#  longer to arrive. cpanel-deploy.mjs uses cPanel's own API over port 2083
#  instead — ordinary HTTPS, one connection, nothing for a firewall to have shut.
#
#  SETTING THE UPLOAD UP — ONCE
#  1. In cPanel → Security → Manage API Tokens, create a token. Name it for
#     whoever uses it — github-news-deploy — so it is obvious later what breaks
#     if it is revoked. Copy it with the button; a token copied by hand and
#     short by one character fails with a bare "Access denied" and no clue.
#     Give it no expiry: a token that quietly expires would strand the news
#     exactly the way the FTP step did.
#  2. In GitHub → Settings → Secrets and variables → Actions → Secrets, add
#       CPANEL_HOST       brightsparksjunior.ac.ug
#       CPANEL_USER       the cPanel account name — the bare name, NOT the
#                         user@domain form an FTP account uses
#       CPANEL_API_TOKEN  the token from step 1
#  3. Run the workflow by hand with "dry run" ticked and read the log before
#     letting it write anything.
#  Without those secrets the build still runs and still commits; it just says
#  in the log that nothing was uploaded.
#
#  A cPanel token has the run of the whole account — cPanel has no way to narrow
#  one to a single folder. It is worth revoking and reissuing if it is ever
#  exposed; nothing in this repository changes when you do.
#
#  It can also be run by hand: Actions → Build news pages → Run workflow.
#  Tick "dry run" there to see what the upload would change, and change nothing.
# ════════════════════════════════════════════════════════════════════════════
name: Build news pages

on:
  schedule:
    # Every 15 minutes, so a story published in the Website Manager is live
    # within the quarter hour rather than the half.
    #
    # A run with no news costs nothing worth counting: the build rewrites a
    # file only when its contents change, the commit step stops when nothing
    # is staged, and the upload says "Nothing has changed" without writing
    # anything. Twenty seconds of finding nothing to do, on a public
    # repository where the minutes are free.
    #
    # GitHub runs scheduled jobs on a best-effort basis and drops them under
    # load, so this is the interval asked for and not the interval promised —
    # a quarter of an hour is the usual wait, not the guaranteed one.
    - cron: '*/15 * * * *'

  # The Website Manager asks for a build the moment somebody publishes, edits,
  # hides or deletes a story, so the page is usually up within a minute and the
  # schedule above is only the safety net for when that call does not arrive.
  # Sent by admin/server.js, which holds the token; the dashboard itself runs in
  # a browser and can never be trusted with one.
  repository_dispatch:
    types: [publish]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list what would be uploaded, upload nothing'
        type: boolean
        default: false
      verbose:
        description: 'Log every request and reply (for when the upload misbehaves)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      # Only when something that shapes the output actually changes — a commit
      # to an unrelated page must not start a second build.
      - 'build-news.mjs'
      - 'news.html'
      - 'news-article.css'
      - 'news-comments.js'
      - 'bsjs-data.js'

# One run at a time. Two builds writing the same files would collide.
concurrency:
  group: news-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Read here rather than inside the step so the upload can be skipped when
    # the server details have not been set yet: a secret cannot be tested in an
    # "if:" directly, but an environment variable can.
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the article pages, sitemaps and feed
        run: node build-news.mjs --ping

      # ────────────────────────────────────────────────────────────────────
      #  KEEP THE RESULT
      # ────────────────────────────────────────────────────────────────────
      #  Between checking the code out and pushing the pages it built, this job
      #  may find that somebody else has pushed — a person working on the site,
      #  or a run of this workflow that overlapped. Git then refuses the push
      #  rather than throwing their work away, and a job that gave up there lost
      #  its own instead: on 3 September a story sat unpublished for exactly
      #  that reason, built and then discarded.
      #
      #  Forcing the push would be the wrong repair — it would drop whatever
      #  arrived. Nothing here needs forcing, though, because these pages are
      #  written from the database rather than edited by hand: the fix is to
      #  take the newer work, write the pages again on top of it, and push that.
      - name: Commit and push whatever changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add news news.html sitemap.xml news-sitemap.xml feed.xml

            # Nothing published since the last run is the normal case, not a
            # failure — the build writes files only when their contents change.
            if git diff --staged --quiet; then
              echo "No new or edited articles. Nothing to commit."
              exit 0
            fi

            git commit -m "chore: rebuild news pages from published articles"
            if git push; then
              exit 0
            fi

            echo "Someone pushed first. Rebuilding on top of their work (attempt ${attempt} of 3)."
            git fetch origin main
            git reset --hard FETCH_HEAD

            # No --ping on a retry: the hub was already told the feed changed
            # on the first pass, and telling it three times helps nobody.
            node build-news.mjs
          done

          echo "::error::Could not push the rebuilt pages after 3 attempts. The articles are"
          echo "::error::still in the database and the next run will build them again."
          exit 1

      # ────────────────────────────────────────────────────────────────────
      #  PUT THE PAGES ON THE LIVE SERVER
      # ────────────────────────────────────────────────────────────────────
      #  Staged rather than uploaded straight from the checkout, because the
      #  repository holds a good deal that has no business on a web server —
      #  the build scripts, this workflow, the admin dashboard's source. The
      #  staged folder is the same list the by-hand zip has always used, so
      #  the two routes cannot drift apart.
      - name: Stage the files that belong on the server
        run: node package-upload.mjs --stage _deploy

      #  cpanel-deploy.mjs keeps its own record of what it has uploaded, on the
      #  server, and touches only the difference. The WordPress blog under /wp,
      #  the photographs and every page the news build does not write are not in
      #  that record, so they are invisible to it and cannot be overwritten or
      #  deleted. A story withdrawn in the dashboard loses its page here, which
      #  is the point.
      - name: Upload to cPanel over HTTPS
        if: env.CPANEL_HOST != ''
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          node cpanel-deploy.mjs \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.verbose == true && '--verbose' || '' }}

      - name: Say so if the server details are missing
        if: env.CPANEL_HOST == ''
        run: |
          echo "::warning::No CPANEL_HOST secret, so nothing was uploaded. The pages" \
               "are committed but not live. Add CPANEL_HOST, CPANEL_USER and" \
               "CPANEL_API_TOKEN under Settings → Secrets and variables → Actions."
