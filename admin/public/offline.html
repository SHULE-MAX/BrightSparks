<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1A2E6E" />
    <title>Offline — Bright Sparks Website Manager</title>
    <!-- Deliberately self-contained: this page is shown when nothing else can
         be fetched, so it cannot depend on a stylesheet or a script. -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f1f5f9;
        color: #1a1a2e;
        font-family: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        width: min(28rem, 100%);
        background: #fff;
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 10px 30px rgba(13, 26, 69, 0.12);
      }
      img {
        width: 100%;
        max-width: 15rem;
        height: auto;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.35rem;
        color: #1a2e6e;
      }
      p {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #5a6480;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #1a2e6e;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #203580;
      }
      :focus-visible {
        outline: 2px solid #2b42a0;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.webp" alt="Bright Sparks Junior School" width="1257" height="666" />
      <h1>You are offline</h1>
      <p>The Website Manager needs a connection to load and to save changes.</p>
      <p>Nothing has been lost — reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload by itself the moment the connection comes back.
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
